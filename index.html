<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slowteam — Player Cards (2025)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="wrap head">
      <div>
        <h1>Slowteam Member Profiles (2025)</h1>
        <div class="sub">
          Thanks you, guys, for that amazing year! We all did really shine! 
        </div>
      </div>

      <div class="controls">
        <input id="q" placeholder="Search by nickname…" />
        <select id="filterMvp">
          <option value="">Filter by best element (all)</option>
        </select>
        <select id="sortBy">
          <option value="joined" selected>Sort: Joined</option>
          <option value="total_desc">Sort: Total 2025 ↓</option>
          <option value="total_asc">Sort: Total 2025 ↑</option>
          <option value="name_asc">Sort: Nick A→Z</option>
          <option value="name_desc">Sort: Nick Z→A</option>
        </select>
        <select id="type">
          <option value="abs_end" selected>Type: Absolute element ranking</option>
          <option value="rel">Type: Relative element ranking</option>
          <option value="growth">Type: Growth (from first to last)</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div id="stats" class="metaLine"></div>
      <div id="grid" class="grid"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
